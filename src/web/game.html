<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Özgürlük Dengesi · ATLAS İnteraktif</title>
<meta name="robots" content="noindex">
<script>
  // Eski adresler yeni tek sayfalık uygulamaya yönlendirilir (ör. game.html?country=Turkey&year=2002)
  (function () {
    var q = new URLSearchParams(location.search);
    var target = (q.get('c') || q.get('country')) ? 'index.html#/oyun/denge' : 'index.html#/oyun';
    var c = q.get('c') || q.get('country') || '';
    var y = q.get('y') || q.get('year') || '';
    var p = new URLSearchParams();
    if (c) p.set('c', c);
    if (y) p.set('y', y);
    location.replace(target + (p.toString() ? '?' + p.toString() : ''));
  })();
</script>
</head>
<body>
<p><a href="index.html#/oyun">Özgürlük Dengesi’ne git</a></p>
</body>
</html>
